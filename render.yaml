# Render Blueprint — aplicația SNCU (NestJS API + SPA React servit din /app).
# MongoDB nu e gestionat de Render: folosește MongoDB Atlas și pune connection
# string-ul în MONGO_URI. Secretele (sync:false) se completează din dashboard.
services:
  - type: web
    name: sncu-app
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 30d
      - key: ACTIVATION_TTL_HOURS
        value: "24"
      # URL-ul public al serviciului (pt. linkuri în emailuri + Stripe). Ex:
      # https://sncu-app.onrender.com
      - key: APP_URL
        sync: false
      - key: PUBLIC_SITE_URL
        value: https://www.bioecolab.ro
      # Cont admin inițial (creat la prima pornire)
      - key: ADMIN_LOGIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Oblio
      - key: OBLIO_EMAIL
        sync: false
      - key: OBLIO_API_TOKEN
        sync: false
      - key: OBLIO_CIF
        sync: false
      - key: OBLIO_INVOICE_SERIES
        sync: false
      # SMTP
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: BioEcoLab <noreply@bioecolab.ro>
      # Prețuri (lei, fără TVA)
      - key: PRICE_BASE
        value: "330"
      - key: PRICE_EXTRA_WORKPOINT
        value: "49.49"
      - key: INCLUDED_WORKPOINTS
        value: "3"
      - key: VAT_RATE
        value: "0.19"
